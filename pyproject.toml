[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopekeeper"
version = "0.3.0"
description = "Scope guard and tamper-evident log for authorised security testing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
scopekeeper = "scopekeeper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
